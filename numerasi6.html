<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numerasi Soal 6</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- BACK BUTTON -->
    <img
      src="img/back.jpg"
      class="back-icon"
      onclick="
        playSound();
        kePilih();
      "
      alt="back"
    />

    <!-- BACKSOUND -->
    <audio id="bgm" loop>
      <source src="audio/backsound.mp3" type="audio/mp3" />
    </audio>

    <!-- CLICK SOUND -->
    <audio id="klikSound">
      <source src="audio/click.mp3" type="audio/mp3" />
    </audio>

    <h1 class="numerasi-title">Soal 6 - Hitung Dasar</h1>

    <div class="soal-box numerasi-box">
      <!-- PETUNJUK -->
      <p class="hint-text">Pilih jawaban yang benar!</p>

      <!-- GAMBAR -->
      <img src="img/numerasi6.jpg" class="numerasi-img" />

      <!-- SOAL -->
      <p class="hint-desc">15 - 8 = ?</p>

      <!-- PILIHAN -->
      <div class="pilihan-container">
        <button class="pilihan-btn" onclick="cekNumerasi6(6)">6</button>
        <button class="pilihan-btn" onclick="cekNumerasi6(7)">7</button>
        <button class="pilihan-btn" onclick="cekNumerasi6(8)">8</button>
        <button class="pilihan-btn" onclick="cekNumerasi6(9)">9</button>
      </div>
    </div>

    <!-- SOUND BENAR -->
    <audio id="benarSound">
      <source src="audio/benar.mp3" type="audio/mp3">
    </audio>

    <!-- SOUND SALAH -->
    <audio id="salahSound">
      <source src="audio/salah.mp3" type="audio/mp3">
    </audio>

    <!-- POPUP HASIL GAMBAR -->
    <div id="popupHasil" class="popup hidden">
      <div class="popup-box">
        <img id="popupImg" src="" />

        <button onclick="playSound(); kePencapaian()">
          SELESAI
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
