<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Game</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- BACKSOUND -->
<audio id="bgm" loop>
  <source src="audio/backsound.mp3" type="audio/mp3" />
</audio>

<!-- SOUND BUTTON -->
<audio id="klikSound">
  <source src="audio/click.mp3" type="audio/mp3">
</audio>


    <!-- ================== HALAMAN PILIH ================== -->
    <div id="pilihPage">
      <!-- HEADER -->
      <h1 class="judul-pilih"> PILIH GAME</h1>

      <!-- CARD CONTAINER -->
      <div class="pilih-container">
        <!-- LITERASI -->
        <div
          class="game-card"
          onclick="
            playSound();
            masukLiterasi();
          "
        >
          <img src="img/literasi.jpg" alt="literasi" />
          <h2> Literasi</h2>
          <p>Menyusun Kata</p>
        </div>

        <!-- NUMERASI -->
        <div
          class="game-card"
          onclick="
            playSound();
            masukNumerasi();
          "
        >
          <img src="img/numerik.jpg" alt="numerasi" />
          <h2> Numerasi</h2>
          <p>Belajar Hitung</p>
        </div>
      </div>

      <!-- BACK BUTTON -->
    <img 
      src="img/back.jpg" 
      class="back-icon" 
      onclick="playSound(); keBeranda();"
      alt="back"
    />

    <script src="script.js"></script>
  </body>
</html>
