<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numerasi Soal 5</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- BACK BUTTON -->
    <img
      src="img/back.jpg"
      class="back-icon"
      onclick="
        playSound();
        kePilih();
      "
      alt="back"
    />

    <!-- BACKSOUND -->
    <audio id="bgm" loop>
      <source src="audio/backsound.mp3" type="audio/mp3" />
    </audio>

    <!-- CLICK SOUND -->
    <audio id="klikSound">
      <source src="audio/click.mp3" type="audio/mp3" />
    </audio>

    <h1 class="numerasi-title">Soal 5 - Hitung Dasar</h1>

    <div class="soal-box numerasi-box">
      <!-- PETUNJUK -->
      <p class="hint-text">Pilih jawaban yang benar!</p>

      <!-- GAMBAR -->
      <img src="img/numerasi5.jpg" class="numerasi-img" />

      <!-- SOAL -->
      <p class="hint-desc">8 + 6 = ?</p>

      <!-- PILIHAN -->
      <div class="pilihan-container">
        <button class="pilihan-btn" onclick="cekNumerasi5(12)">12</button>
        <button class="pilihan-btn" onclick="cekNumerasi5(13)">13</button>
        <button class="pilihan-btn" onclick="cekNumerasi5(14)">14</button>
        <button class="pilihan-btn" onclick="cekNumerasi5(15)">15</button>
      </div>
    </div>

    <!-- SOUND BENAR -->
    <audio id="benarSound">
      <source src="audio/benar.mp3" type="audio/mp3">
    </audio>

    <!-- SOUND SALAH -->
    <audio id="salahSound">
      <source src="audio/salah.mp3" type="audio/mp3">
    </audio>

    <!-- POPUP HASIL GAMBAR -->
    <div id="popupHasil" class="popup hidden">
      <div class="popup-box">
        <img id="popupImg" src="" />

        <button
          onclick="
            playSound();
            keNumerasi6();
          "
        >
          NEXT
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
